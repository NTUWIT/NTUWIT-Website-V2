# Piston behind Caddy. Caddy terminates TLS and rejects anything without the
# shared secret, so the box is not an open code-execution endpoint.
services:
  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: piston
    restart: always
    privileged: true            # isolate needs cgroup control; this is why a real VM is required
    environment:
      # Piston rejects any request whose run_timeout exceeds this cap with a
      # 400, which the platform surfaces as JUDGE_UNAVAILABLE. The default is
      # 3000ms, which is below the 5000ms problems now ask for because Java
      # spends most of a 3s budget starting the JVM. Keep this at or above the
      # largest problem timeLimitMs, and below REQUEST_TIMEOUT_MS in
      # lib/judge/piston.ts (8000ms).
      PISTON_RUN_TIMEOUT: 6000
      PISTON_COMPILE_TIMEOUT: 10000
    tmpfs:
      - /piston/jobs:exec,uid=1000,gid=1000,mode=711
    volumes:
      - ./data:/piston
    # Not published to the host: only Caddy can reach it.
    expose:
      - "2000"

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      PISTON_HOST: ${PISTON_HOST:?set PISTON_HOST, e.g. 203-0-113-5.sslip.io}
      PISTON_TOKEN: ${PISTON_TOKEN:?set PISTON_TOKEN, generate with openssl rand -hex 32}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
